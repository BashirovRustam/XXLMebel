version: "3.9"

services:
  db:
    image: postgres:15
    container_name: xxlmebel_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  web:
    build: .
    container_name: xxlmebel_web
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    env_file:
      - .env
    working_dir: /app
    environment:
      - PYTHONPATH=/app
    depends_on:
      - db

  db_seeder:
    build: .
    container_name: xxlmebel_db_seeder
    command: python -m app.db.db_seeder
    volumes:
      - .:/app
    env_file:
      - .env
    working_dir: /app
    environment:
      - PYTHONPATH=/app
    depends_on:
      - db

volumes:
  postgres_data:
